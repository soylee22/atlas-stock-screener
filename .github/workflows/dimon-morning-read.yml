name: Jamie Dimon Morning Read

on:
  schedule:
    # Runs daily at 06:00 UTC (06:00 GMT / 07:00 BST)
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: dimon-morning-read
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-dimon-read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install trafilatura

      - name: Generate and dispatch Jamie Dimon Morning Read
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DIMON_TG_THREAD: "4"
        run: |
          python dimon_briefing.py
