name: Portfolio Command Briefing

on:
  schedule:
    # Runs daily after US market close at 21:45 UTC (Monday to Friday)
    - cron: '45 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: portfolio-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance playwright
          playwright install chromium --with-deps

      - name: Generate and dispatch portfolio briefing
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_THREAD: ${{ secrets.TG_THREAD }}
          T212_KEY_ID: ${{ secrets.T212_KEY_ID }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python dispatch_portfolio_briefing.py

      - name: Commit and push StockRank history update
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add seed/stockrank_history.json
          git commit -m "Update live StockRank tracking history [skip ci]" || echo "No factor changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Upload HTML briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-briefing-html
          path: public/portfolio_briefing.html
          retention-days: 14
