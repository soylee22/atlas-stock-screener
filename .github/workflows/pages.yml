name: Refresh and publish Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_quotes:
        description: Refresh all six markets now
        type: boolean
        default: false
      enrich_limit:
        description: Maximum company profiles in this batch
        type: number
        default: 400
  schedule:
    - cron: '23 */4 * * *'

concurrency:
  group: atlas-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check calculations and publication
        run: |
          python -m pytest -q tests
          node --experimental-default-type=module tests/test_format.mjs
          node --experimental-default-type=module tests/test_snapshot.mjs
          node --experimental-default-type=module tests/test_quadrant.mjs
          node --check static/quadrant.js
          node --check static/app.js
      - name: Restore market data cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data
          key: atlas-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: atlas-data-v1-
      - name: Restore initial public snapshot
        run: python refresh_data.py --seed-only
      - name: Refresh Yahoo data
        if: github.event_name != 'push'
        env:
          FORCE_QUOTES: ${{ inputs.force_quotes || 'false' }}
          ENRICH_LIMIT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enrich_limit) || '400' }}
        run: |
          args=(--seconds 720 --limit "$ENRICH_LIMIT")
          if [ "$FORCE_QUOTES" = true ]; then args+=(--force-quotes); fi
          python refresh_data.py "${args[@]}"
      - name: Build public site
        # Populate new growth fields even when a push skips the full provider scan.
        run: |
          python refresh_data.py --growth-only --seconds 1200 --limit 30000 --workers 4
          python build_site.py --output public
      - name: Preserve refreshed data
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data
          key: atlas-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
